<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#1e3a8a" stopOpacity="0.9" />
      <stop offset="70%" stopColor="#0f172a" stopOpacity="0.98" />
      <stop offset="100%" stopColor="#020617" stopOpacity="1" />
    </radialGradient>
    <linearGradient id="body-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="20%" stopColor="#2563eb" />
      <stop offset="85%" stopColor="#1d4ed8" />
      <stop offset="100%" stopColor="#1e3a8a" />
    </linearGradient>
    <linearGradient id="body-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#3b82f6" />
      <stop offset="35%" stopColor="#2563eb" />
      <stop offset="80%" stopColor="#1d4ed8" />
      <stop offset="100%" stopColor="#172554" />
    </linearGradient>
    <linearGradient id="top-specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0" />
      <stop offset="25%" stopColor="#ffffff" stopOpacity="0.6" />
      <stop offset="50%" stopColor="#ffffff" stopOpacity="0.85" />
      <stop offset="75%" stopColor="#ffffff" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
    </linearGradient>
    <linearGradient id="eye-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#e2e8f0" />
    </linearGradient>
    <linearGradient id="pupil-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#090d16" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#space-bg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" />
  <circle cx="45" cy="45" r="2.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="160" cy="55" r="2" fill="#38bdf8" opacity="0.5" />
  <circle cx="155" cy="155" r="3" fill="#60a5fa" opacity="0.4" />
  <circle cx="35" cy="140" r="2" fill="#38bdf8" opacity="0.5" />

  <!-- Robot Face -->
  <!-- Outer Pill Bevel -->
  <path d="M 64,52 L 136,52 A 42,42 0 0 1 178,94 A 42,42 0 0 1 136,136 L 110,136 L 100,150 L 93,136 L 64,136 A 42,42 0 0 1 22,94 A 42,42 0 0 1 64,52 Z" fill="url(#body-bevel)" />
  <!-- Inner Pill Front -->
  <path d="M 64,56 L 136,56 A 38,38 0 0 1 174,94 A 38,38 0 0 1 136,132 L 108,132 L 100,144 L 94,132 L 64,132 A 38,38 0 0 1 26,94 A 38,38 0 0 1 64,56 Z" fill="url(#body-face)" />
  <!-- Top Specular Highlight -->
  <path d="M 58,58 L 142,58 C 160,58 170,72 170,82 C 152,66 130,64 100,64 C 70,64 48,66 30,82 C 30,72 40,58 58,58 Z" fill="url(#top-specular)" opacity="0.65" />

  <!-- Left Eye -->
  <rect x="53" y="80" width="24" height="24" rx="4" transform="rotate(45 65 92)" fill="url(#eye-white)" />
  <rect x="62" y="86" width="10" height="10" rx="2" transform="rotate(45 67 91)" fill="url(#pupil-black)" />
  <circle cx="62" cy="88" r="1.5" fill="#ffffff" opacity="0.9" />

  <!-- Right Eye -->
  <rect x="123" y="80" width="24" height="24" rx="4" transform="rotate(45 135 92)" fill="url(#eye-white)" />
  <rect x="128" y="86" width="10" height="10" rx="2" transform="rotate(45 133 91)" fill="url(#pupil-black)" />
  <circle cx="138" cy="88" r="1.5" fill="#ffffff" opacity="0.9" />

  <!-- Cute Smile -->
  <path d="M 90,98 Q 100,111 110,98" fill="none" stroke="#090d16" stroke-width="5" stroke-linecap="round" />
  <path d="M 93,101 Q 100,111 107,101" fill="none" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
</svg>
